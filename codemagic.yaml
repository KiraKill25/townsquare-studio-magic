workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: |
          export NODE_ENV=development
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/status-bar @capacitor-community/keep-awake
      - name: STEP 2 - Build Web App & Setup Android
        script: |
          export NODE_ENV=development
          mkdir -p public assets
          cp icon.png public/icon.png 2>/dev/null || true
          cp icon.png assets/icon.png 2>/dev/null || true
          cp icon.png assets/splash.png 2>/dev/null || true
          
          # Clean previous build artifacts
          rm -rf android dist .output
          
          # 1. Build client bundle
          npm run build
          
          # 2. Fail-safe: Ensure index.html exists in .output/public
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            echo "Generating fallback index.html for Capacitor..."
            ENTRY_JS=$(ls .output/public/assets/index-*.js 2>/dev/null | head -n 1 | xargs -n 1 basename || echo "")
            cat <<EOF > .output/public/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Mourad's Ville</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/assets/$ENTRY_JS"></script>
            </body>
          </html>
          EOF
          fi
          
          # 3. Initialize Android shell
          npx cap add android
          
          # 4. Generate app icons & splash screens
          npx @capacitor/assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000" || true
          
          # 5. Sync web bundle to Android native folder
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
