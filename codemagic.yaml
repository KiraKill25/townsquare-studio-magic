workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: |
          export NODE_ENV=development
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/status-bar @capacitor-community/keep-awake
      - name: STEP 2 - Build Web App & Setup Android
        script: |
          export NODE_ENV=development
          mkdir -p public assets
          cp icon.png public/icon.png 2>/dev/null || true
          cp icon.png assets/icon.png 2>/dev/null || true
          cp icon.png assets/splash.png 2>/dev/null || true
          
          # Clean old build outputs
          rm -rf android dist .output
          
          # 1. Build web app using TanStack Start / Nitro
          npm run build
          
          # Ensure dist compatibility link exists
          if [ -d ".output/public" ]; then
            cp -r .output/public dist
          fi
          
          # 2. Add fresh Android native project
          npx cap add android
          
          # 3. Generate splash and app icon assets
          npx @capacitor/assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000" || true
          
          # 4. Sync assets into Android native shell
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
